<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    .table-bordered{
      border-color:red;
      border-width:3px;
    }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">
  <div class="container-fluid">
    <a class="navbar-brand fs-2 fst-italic text-danger" href="#">Library App</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav mx-auto mb-2 mb-lg-0 fs-5 fst-italic">
        <li class="nav-item">
          <a class="nav-link active text-danger" aria-current="page" href="{% url 'books:home' %}">Home</a>
        </li>
         {% if user.is_authenticated %}
        <li class="nav-item">
          <a class="nav-link text-danger" href="{% url 'books:addbooks' %}">Addbooks</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-danger" href="{% url 'books:viewbooks' %}">Viewbooks</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-danger" href="{% url 'users:userlogout' %}">Logout</a>
        </li>
        {% else %}
         <li class="nav-item">
          <a class="nav-link text-danger" href="{% url 'users:register' %}">Register</a>
        </li>
          <li class="nav-item">
          <a class="nav-link text-danger" href="{% url 'users:userlogin' %}">Login</a>
        </li>
        {% endif %}
      </ul>
      {% if user.is_authenticated %}
      <form action="{% url 'books:search' %}" class="d-flex">
        <input class="form-control me-2" type="search" name="q" placeholder="Search" aria-label="Search">
        <button class="btn btn-outline-danger" type="submit">Search</button>
      </form>
      {% endif %}
    </div>
  </div>
</nav>
{% block content %}
{% endblock %}
</body>
</html>
