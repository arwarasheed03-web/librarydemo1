{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container text-center w-50 p-5 mt-5 border border-3 border-danger">
  <h1>LOGIN</h1>
  <form method="post">
        {% csrf_token %}
        {{form|crispy}}
    <input type="submit" class="btn btn-danger">
  </form>
    {% if messages %}
<ul class="messages">
    {% for message in messages %}
    <li{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</li>
    {% endfor %}
</ul>
{% endif %}
</div>
{% endblock %}
